<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Quest — Create Profile</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Navigation bar -->
    <nav class="navbar">
      <a class="brand" href="index.html">Study Quest</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="about.html">About</a>
      </div>
      <!-- Language switch -->
      <div class="lang-switch">
        <a href="profile.html" class="active">EN</a>
        <span class="lang-sep">|</span>
        <a href="ko/profile.html">한국어</a>
      </div>
    </nav>

    <main class="container">
      <!-- Create profile card -->
      <section class="card profile-card">
        <h2 class="profile-heading">Create profile</h2>
        <p class="subtitle profile-sub">Join the quest and climb the leaderboard.</p>

        <!-- Profile form: creates an account; the database makes the profile row -->
        <form class="profile-form" id="profile-form" novalidate>
          <!-- Name -->
          <div class="form-field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your full name" required />
          </div>

          <!-- Nickname (shown on leaderboard instead of real name) -->
          <div class="form-field">
            <label for="nickname">Nickname</label>
            <input type="text" id="nickname" name="nickname" placeholder="Leaderboard name" required />
            <span class="form-hint">Shown on the leaderboard instead of your real name.</span>
          </div>

          <!-- Age -->
          <div class="form-field">
            <label for="age">Age</label>
            <input type="number" id="age" name="age" placeholder="20" min="1" max="120" />
          </div>

          <!-- Level of education dropdown -->
          <div class="form-field">
            <label for="education">Level of education</label>
            <select id="education" name="education">
              <option value="" disabled selected>Select your level</option>
              <option value="undergraduate">Undergraduate</option>
              <option value="master">Master's</option>
              <option value="phd">PhD</option>
            </select>
          </div>

          <!-- Email -->
          <div class="form-field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required />
          </div>

          <!-- Password -->
          <div class="form-field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required />
          </div>

          <!-- Submit button -->
          <button type="submit" class="btn btn-primary profile-submit">Create profile</button>
        </form>

        <!-- Success / error message area (filled by JavaScript) -->
        <p class="form-message" id="form-message"></p>

        <!-- Link for students who already have an account -->
        <p class="login-link">Already have an account? <a href="login.html">Log in</a></p>
      </section>
    </main>

    <!-- Load Supabase from the CDN, then the shared client, then profile logic -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script>
      // Grab the form and the message area from the page
      var form = document.getElementById("profile-form");
      var message = document.getElementById("form-message");

      // Show a message in green (success) or red (error)
      function showMessage(text, type) {
        message.textContent = text;
        message.className = "form-message " + type;
      }

      // When the student presses "Create profile"
      form.addEventListener("submit", function (e) {
        // Stop the page from reloading
        e.preventDefault();

        // Read the values the student typed
        var email = document.getElementById("email").value.trim();
        var password = document.getElementById("password").value;
        var name = document.getElementById("name").value.trim();
        var nickname = document.getElementById("nickname").value.trim();
        var age = document.getElementById("age").value;
        var education = document.getElementById("education").value;

        // Sign up with Supabase Auth. The extra profile details go in
        // options.data — a database trigger uses them to create the
        // profiles row automatically. We never insert into profiles here.
        sq.auth
          .signUp({
            email: email,
            password: password,
            options: {
              data: {
                name: name,
                nickname: nickname,
                age: age,
                education: education,
              },
            },
          })
          .then(function (result) {
            var error = result.error;

            if (error) {
              // Log the full error for debugging
              console.log("Sign-up error:", error);

              // Friendly message with the real error text underneath
              showMessage(
                "Could not create your profile. " + error.message,
                "error"
              );
              return;
            }

            // Success! Tell the student and go to the school page
            showMessage("Profile created! Taking you to school selection...", "success");
            window.location.href = "school.html";
          })
          .catch(function (err) {
            // Network or unexpected failure
            console.log("Sign-up error:", err);
            showMessage("Could not create your profile. " + err.message, "error");
          });
      });
    </script>
    <!-- Update navbar based on login state -->
    <script src="auth.js"></script>
  </body>
</html>
