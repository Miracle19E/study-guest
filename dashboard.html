<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Quest — Dashboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Navigation bar -->
    <nav class="navbar">
      <a class="brand" href="index.html">Study Quest</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="dashboard.html" class="active">Dashboard</a>
        <a href="about.html">About</a>
      </div>
      <!-- Language switch -->
      <div class="lang-switch">
        <a href="dashboard.html" class="active">EN</a>
        <span class="lang-sep">|</span>
        <a href="ko/dashboard.html">한국어</a>
      </div>
    </nav>

    <main class="container">
      <h1 class="page-title">Dashboard</h1>
      <p class="subtitle">Your study progress at a glance.</p>

      <!-- Stat cards: XP, level, streak -->
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-value">1,250</div>
          <div class="stat-label">XP Points</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">Level 5</div>
          <div class="stat-label">Current Level</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">5 days</div>
          <div class="stat-label">Study Streak</div>
        </div>
      </div>

      <!-- Anonymous leaderboard -->
      <div class="card">
        <h2 style="font-size:1.2rem; margin:0 0 16px;">Top Students</h2>
        <table class="leaderboard">
          <thead>
            <tr>
              <th>Rank</th>
              <th>Name</th>
              <th>XP</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="rank-1">1</td>
              <td>Student_01</td>
              <td>3,800</td>
            </tr>
            <tr>
              <td>2</td>
              <td>Student_02</td>
              <td>3,200</td>
            </tr>
            <tr>
              <td>3</td>
              <td>Student_03</td>
              <td>2,950</td>
            </tr>
            <tr>
              <td>4</td>
              <td>Student_04</td>
              <td>2,100</td>
            </tr>
            <tr>
              <td>5</td>
              <td>You</td>
              <td>1,250</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Action button to start a new quiz -->
      <div class="actions-row">
        <a class="btn btn-primary" href="school.html">Start New Quiz</a>
      </div>
    </main>
  </body>
</html>
