<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Quest — Web Programming Quiz</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Navigation bar -->
    <nav class="navbar">
      <a class="brand" href="index.html">Study Quest</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="about.html">About</a>
      </div>
      <!-- Language switch -->
      <div class="lang-switch">
        <a href="quiz-webprogramming.html" class="active">EN</a>
        <span class="lang-sep">|</span>
        <a href="ko/quiz-webprogramming.html">한국어</a>
      </div>
    </nav>

    <main class="container">
      <!-- Quiz header: timer + score -->
      <div class="quiz-header">
        <span class="timer">⏱ 00:30</span>
        <span class="score-box" id="score-box">Score: 0</span>
      </div>

      <h1 class="page-title">Web Programming Quiz</h1>
      <p class="subtitle">3 questions • 30 seconds each</p>

      <!-- Progress bar -->
      <p class="progress-label" id="progress-label">Question 1 of 3</p>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>

      <!-- The question card (filled by JavaScript) -->
      <div class="card">
        <p class="question-text" id="question-text">Loading...</p>
        <div class="answer-options" id="answer-options"></div>
        <p class="explanation" id="explanation"></p>
      </div>

      <!-- Next button (shown after answering) -->
      <div class="actions-row">
        <button class="btn btn-primary next-btn" id="next-btn">Next</button>
      </div>
    </main>

    <!-- Quiz data as JSON (read by script.js) -->
    <script type="application/json" id="quiz-data">
    {
      "subject": "Web Programming",
      "resultsUrl": "results.html",
      "labels": { "question": "Question", "of": "of", "next": "Next", "viewResults": "View Results", "score": "Score" },
      "questions": [
        {
          "question": "Q1. Which HTML tag creates a hyperlink?",
          "options": ["A. <link>", "B. <a>", "C. <href>", "D. <url>"],
          "correct": 1,
          "topic": "HTML basics",
          "explanation": "The <a> tag (anchor) creates hyperlinks with the href attribute."
        },
        {
          "question": "Q2. What does CSS stand for?",
          "options": ["A. Computer Style Sheets", "B. Creative Style System", "C. Cascading Style Sheets", "D. Colorful Style Sheets"],
          "correct": 2,
          "topic": "CSS fundamentals",
          "explanation": "CSS stands for Cascading Style Sheets — it controls how web pages look."
        },
        {
          "question": "Q3. Which property changes text color in CSS?",
          "options": ["A. font-color", "B. text-color", "C. color", "D. background-color"],
          "correct": 2,
          "topic": "CSS properties",
          "explanation": "The 'color' property sets the text color. 'background-color' sets the background."
        }
      ]
    }
    </script>
    <script src="script.js"></script>
  </body>
</html>
