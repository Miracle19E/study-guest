<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Quest — Statistics Quiz</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Navigation bar -->
    <nav class="navbar">
      <a class="brand" href="index.html">Study Quest</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="about.html">About</a>
      </div>
      <!-- Language switch -->
      <div class="lang-switch">
        <a href="quiz-statistics.html" class="active">EN</a>
        <span class="lang-sep">|</span>
        <a href="ko/quiz-statistics.html">한국어</a>
      </div>
    </nav>

    <main class="container">
      <!-- Quiz header: timer + score -->
      <div class="quiz-header">
        <span class="timer">⏱ 00:30</span>
        <span class="score-box" id="score-box">Score: 0</span>
      </div>

      <h1 class="page-title">Statistics Quiz</h1>
      <p class="subtitle">3 questions • 30 seconds each</p>

      <!-- Progress bar -->
      <p class="progress-label" id="progress-label">Question 1 of 3</p>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>

      <!-- The question card (filled by JavaScript) -->
      <div class="card">
        <p class="question-text" id="question-text">Loading...</p>
        <div class="answer-options" id="answer-options"></div>
        <p class="explanation" id="explanation"></p>
      </div>

      <!-- Next button (shown after answering) -->
      <div class="actions-row">
        <button class="btn btn-primary next-btn" id="next-btn">Next</button>
      </div>
    </main>

    <!-- Quiz data as JSON (read by script.js) -->
    <script type="application/json" id="quiz-data">
    {
      "subject": "Statistics",
      "resultsUrl": "results.html",
      "labels": { "question": "Question", "of": "of", "next": "Next", "viewResults": "View Results", "score": "Score" },
      "questions": [
        {
          "question": "Q1. What is the median of {2, 4, 6, 8, 10}?",
          "options": ["A. 4", "B. 6", "C. 8", "D. 10"],
          "correct": 1,
          "topic": "Median",
          "explanation": "The median is the middle value. With 5 sorted numbers, the middle one is 6."
        },
        {
          "question": "Q2. A normal distribution is also called a:",
          "options": ["A. Bell curve", "B. Box plot", "C. Bar chart", "D. Pie chart"],
          "correct": 0,
          "topic": "Distributions",
          "explanation": "A normal distribution has a symmetric bell shape, so it's called a bell curve."
        },
        {
          "question": "Q3. Which measure shows the spread of data?",
          "options": ["A. Mean", "B. Median", "C. Mode", "D. Standard deviation"],
          "correct": 3,
          "topic": "Spread and variance",
          "explanation": "Standard deviation measures how spread out the data is from the mean."
        }
      ]
    }
    </script>
    <script src="script.js"></script>
  </body>
</html>
