<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Quest — C Programming Quiz</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Navigation bar -->
    <nav class="navbar">
      <a class="brand" href="index.html">Study Quest</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="about.html">About</a>
      </div>
      <!-- Language switch -->
      <div class="lang-switch">
        <a href="quiz-c.html" class="active">EN</a>
        <span class="lang-sep">|</span>
        <a href="ko/quiz-c.html">한국어</a>
      </div>
    </nav>

    <main class="container">
      <!-- Quiz header: timer + score -->
      <div class="quiz-header">
        <span class="timer">⏱ 00:30</span>
        <span class="score-box" id="score-box">Score: 0</span>
      </div>

      <h1 class="page-title">C Programming Quiz</h1>
      <p class="subtitle">3 questions • 30 seconds each</p>

      <!-- Progress bar -->
      <p class="progress-label" id="progress-label">Question 1 of 3</p>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>

      <!-- The question card (filled by JavaScript) -->
      <div class="card">
        <p class="question-text" id="question-text">Loading...</p>
        <div class="answer-options" id="answer-options"></div>
        <p class="explanation" id="explanation"></p>
      </div>

      <!-- Next button (shown after answering) -->
      <div class="actions-row">
        <button class="btn btn-primary next-btn" id="next-btn">Next</button>
      </div>
    </main>

    <!-- Quiz data as JSON (read by script.js) -->
    <script type="application/json" id="quiz-data">
    {
      "subject": "C Programming",
      "resultsUrl": "results.html",
      "labels": { "question": "Question", "of": "of", "next": "Next", "viewResults": "View Results", "score": "Score" },
      "questions": [
        {
          "question": "Q1. Which function prints output in C?",
          "options": ["A. print()", "B. printf()", "C. echo()", "D. display()"],
          "correct": 1,
          "topic": "Input/Output",
          "explanation": "printf() is the standard C function for printing formatted output to the screen."
        },
        {
          "question": "Q2. What is the size of an int in standard C (bytes)?",
          "options": ["A. 2", "B. 4", "C. 8", "D. It depends on the system"],
          "correct": 3,
          "topic": "Data types",
          "explanation": "In C, the size of int is not fixed — it depends on the system and compiler."
        },
        {
          "question": "Q3. Which symbol starts a single-line comment in C?",
          "options": ["A. #", "B. //", "C. --", "D. <!--"],
          "correct": 1,
          "topic": "Syntax basics",
          "explanation": "The // symbol starts a single-line comment in C (C99 and later)."
        }
      ]
    }
    </script>
    <!-- Quiz logic (ES module so it can import supabase) -->
    <script type="module" src="script.js"></script>
    <!-- Update navbar based on login state -->
    <script type="module" src="auth.js"></script>
  </body>
</html>
