<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Quest — 웹 프로그래밍 퀴즈</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body class="ko">
    <!-- 네비게이션 바 -->
    <nav class="navbar">
      <a class="brand" href="index.html">Study Quest</a>
      <div class="nav-links">
        <a href="index.html">홈</a>
        <a href="dashboard.html">대시보드</a>
        <a href="about.html">소개</a>
      </div>
      <!-- 언어 전환 -->
      <div class="lang-switch">
        <a href="../quiz-webprogramming.html">EN</a>
        <span class="lang-sep">|</span>
        <a href="quiz-webprogramming.html" class="active">한국어</a>
      </div>
    </nav>

    <main class="container">
      <!-- 퀴즈 헤더: 타이머 + 점수 -->
      <div class="quiz-header">
        <span class="timer">⏱ 00:30</span>
        <span class="score-box" id="score-box">점수: 0</span>
      </div>

      <h1 class="page-title">웹 프로그래밍 퀴즈</h1>
      <p class="subtitle">3문제 • 문제당 30초</p>

      <!-- 진행 바 -->
      <p class="progress-label" id="progress-label">문제 1 / 3</p>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>

      <!-- 문제 카드 (JavaScript로 채워짐) -->
      <div class="card">
        <p class="question-text" id="question-text">로딩 중...</p>
        <div class="answer-options" id="answer-options"></div>
        <p class="explanation" id="explanation"></p>
      </div>

      <!-- 다음 버튼 (답변 후 표시됨) -->
      <div class="actions-row">
        <button class="btn btn-primary next-btn" id="next-btn">다음</button>
      </div>
    </main>

    <!-- 퀴즈 데이터 JSON (script.js가 읽음) -->
    <script type="application/json" id="quiz-data">
    {
      "subject": "웹 프로그래밍",
      "resultsUrl": "results.html",
      "labels": { "question": "문제", "of": "/", "next": "다음", "viewResults": "결과 보기", "score": "점수" },
      "questions": [
        {
          "question": "Q1. 하이퍼링크를 만드는 HTML 태그는?",
          "options": ["A. <link>", "B. <a>", "C. <href>", "D. <url>"],
          "correct": 1,
          "topic": "HTML 기초",
          "explanation": "<a> 태그(앵커)가 href 속성과 함께 하이퍼링크를 만듭니다."
        },
        {
          "question": "Q2. CSS의 약자는 무엇인가요?",
          "options": ["A. Computer Style Sheets", "B. Creative Style System", "C. Cascading Style Sheets", "D. Colorful Style Sheets"],
          "correct": 2,
          "topic": "CSS 기초",
          "explanation": "CSS는 Cascading Style Sheets의 약자로, 웹 페이지의 모양을 제어합니다."
        },
        {
          "question": "Q3. CSS에서 글자 색을 변경하는 속성은?",
          "options": ["A. font-color", "B. text-color", "C. color", "D. background-color"],
          "correct": 2,
          "topic": "CSS 속성",
          "explanation": "'color' 속성이 글자 색을 설정합니다. 'background-color'는 배경색을 설정합니다."
        }
      ]
    }
    </script>
    <script src="script.js"></script>
  </body>
</html>
