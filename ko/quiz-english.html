<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Quest — 영어 퀴즈</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body class="ko">
    <!-- 네비게이션 바 -->
    <nav class="navbar">
      <a class="brand" href="index.html">Study Quest</a>
      <div class="nav-links">
        <a href="index.html">홈</a>
        <a href="dashboard.html">대시보드</a>
        <a href="about.html">소개</a>
      </div>
      <!-- 언어 전환 -->
      <div class="lang-switch">
        <a href="../quiz-english.html">EN</a>
        <span class="lang-sep">|</span>
        <a href="quiz-english.html" class="active">한국어</a>
      </div>
    </nav>

    <main class="container">
      <!-- 퀴즈 헤더: 타이머 + 점수 -->
      <div class="quiz-header">
        <span class="timer">⏱ 00:30</span>
        <span class="score-box" id="score-box">점수: 0</span>
      </div>

      <h1 class="page-title">영어 퀴즈</h1>
      <p class="subtitle">3문제 • 문제당 30초</p>

      <!-- 진행 바 -->
      <p class="progress-label" id="progress-label">문제 1 / 3</p>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>

      <!-- 문제 카드 (JavaScript로 채워짐) -->
      <div class="card">
        <p class="question-text" id="question-text">로딩 중...</p>
        <div class="answer-options" id="answer-options"></div>
        <p class="explanation" id="explanation"></p>
      </div>

      <!-- 다음 버튼 (답변 후 표시됨) -->
      <div class="actions-row">
        <button class="btn btn-primary next-btn" id="next-btn">다음</button>
      </div>
    </main>

    <!-- 퀴즈 데이터 JSON (script.js가 읽음) -->
    <script type="application/json" id="quiz-data">
    {
      "subject": "영어",
      "resultsUrl": "results.html",
      "labels": { "question": "문제", "of": "/", "next": "다음", "viewResults": "결과 보기", "score": "점수" },
      "questions": [
        {
          "question": "Q1. 올바른 문장을 고르세요:",
          "options": ["A. She don't like tea.", "B. She doesn't likes tea.", "C. She doesn't like tea.", "D. She not like tea."],
          "correct": 2,
          "topic": "주어-동사 일치",
          "explanation": "'she'와 함께 'doesn't' + 동사 원형을 씁니다: 'She doesn't like tea.'"
        },
        {
          "question": "Q2. \"go\"의 과거형은?",
          "options": ["A. Goed", "B. Went", "C. Gone", "D. Going"],
          "correct": 1,
          "topic": "불규칙 동사",
          "explanation": "'go'는 불규칙 동사로, 과거형은 'went'입니다."
        },
        {
          "question": "Q3. \"happy\"의 동의어는?",
          "options": ["A. Sad", "B. Angry", "C. Joyful", "D. Tired"],
          "correct": 2,
          "topic": "어휘",
          "explanation": "'Joyful'은 'happy'와 같은 뜻으로, 둘 다 긍정적인 감정을 나타냅니다."
        }
      ]
    }
    </script>
    <!-- Supabase 로드 후 퀴즈 로직 (클래식 스크립트, 모듈 없음) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase.js"></script>
    <script src="script.js"></script>
    <!-- Update navbar based on login state -->
    <script src="../auth.js"></script>
  </body>
</html>
