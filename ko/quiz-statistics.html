<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Quest — 통계학 퀴즈</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body class="ko">
    <!-- 네비게이션 바 -->
    <nav class="navbar">
      <a class="brand" href="index.html">Study Quest</a>
      <div class="nav-links">
        <a href="index.html">홈</a>
        <a href="dashboard.html">대시보드</a>
        <a href="about.html">소개</a>
      </div>
      <!-- 언어 전환 -->
      <div class="lang-switch">
        <a href="../quiz-statistics.html">EN</a>
        <span class="lang-sep">|</span>
        <a href="quiz-statistics.html" class="active">한국어</a>
      </div>
    </nav>

    <main class="container">
      <!-- 퀴즈 헤더: 타이머 + 점수 -->
      <div class="quiz-header">
        <span class="timer">⏱ 00:30</span>
        <span class="score-box" id="score-box">점수: 0</span>
      </div>

      <h1 class="page-title">통계학 퀴즈</h1>
      <p class="subtitle">3문제 • 문제당 30초</p>

      <!-- 진행 바 -->
      <p class="progress-label" id="progress-label">문제 1 / 3</p>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>

      <!-- 문제 카드 (JavaScript로 채워짐) -->
      <div class="card">
        <p class="question-text" id="question-text">로딩 중...</p>
        <div class="answer-options" id="answer-options"></div>
        <p class="explanation" id="explanation"></p>
      </div>

      <!-- 다음 버튼 (답변 후 표시됨) -->
      <div class="actions-row">
        <button class="btn btn-primary next-btn" id="next-btn">다음</button>
      </div>
    </main>

    <!-- 퀴즈 데이터 JSON (script.js가 읽음) -->
    <script type="application/json" id="quiz-data">
    {
      "subject": "통계학",
      "resultsUrl": "results.html",
      "labels": { "question": "문제", "of": "/", "next": "다음", "viewResults": "결과 보기", "score": "점수" },
      "questions": [
        {
          "question": "Q1. {2, 4, 6, 8, 10}의 중앙값은?",
          "options": ["A. 4", "B. 6", "C. 8", "D. 10"],
          "correct": 1,
          "topic": "중앙값",
          "explanation": "중앙값은 가운데 값입니다. 5개의 정렬된 숫자 중 가운데는 6입니다."
        },
        {
          "question": "Q2. 정규분포는 다음 중 어떤 것으로도 불리나요?",
          "options": ["A. 종형 곡선", "B. 박스 플롯", "C. 막대 그래프", "D. 파이 차트"],
          "correct": 0,
          "topic": "분포",
          "explanation": "정규분포는 대칭적인 종 모양이어서 종형 곡선이라고도 불립니다."
        },
        {
          "question": "Q3. 데이터의 퍼짐 정도를 나타내는 척도는?",
          "options": ["A. 평균", "B. 중앙값", "C. 최빈값", "D. 표준편차"],
          "correct": 3,
          "topic": "산포도",
          "explanation": "표준편차는 데이터가 평균으로부터 얼마나 퍼져 있는지를 나타냅니다."
        }
      ]
    }
    </script>
    <!-- Quiz logic (ES module so it can import supabase) -->
    <script type="module" src="script.js"></script>
    <!-- Update navbar based on login state -->
    <script type="module" src="../auth.js"></script>
  </body>
</html>
