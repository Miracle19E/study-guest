<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Quest — 로그인</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body class="ko">
    <!-- 네비게이션 바 -->
    <nav class="navbar">
      <a class="brand" href="index.html">Study Quest</a>
      <div class="nav-links">
        <a href="index.html">홈</a>
        <a href="dashboard.html">대시보드</a>
        <a href="about.html">소개</a>
      </div>
      <!-- 언어 전환 -->
      <div class="lang-switch">
        <a href="../login.html">EN</a>
        <span class="lang-sep">|</span>
        <a href="login.html" class="active">한국어</a>
      </div>
    </nav>

    <main class="container">
      <!-- 로그인 카드 -->
      <section class="card profile-card">
        <h2 class="profile-heading">로그인</h2>
        <p class="subtitle profile-sub">다시 오신 것을 환영합니다! 계속하려면 정보를 입력하세요.</p>

        <!-- 로그인 폼 -->
        <form class="profile-form" id="login-form" novalidate>
          <!-- 이메일 -->
          <div class="form-field" style="grid-column:1/-1;">
            <label for="email">이메일</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required />
          </div>

          <!-- 비밀번호 -->
          <div class="form-field" style="grid-column:1/-1;">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required />
          </div>

          <!-- 제출 버튼 -->
          <button type="submit" class="btn btn-primary profile-submit" style="grid-column:1/-1;">로그인</button>
        </form>

        <!-- 성공 / 오류 메시지 영역 -->
        <p class="form-message" id="form-message"></p>

        <!-- 새 학생을 위한 프로필 만들기 링크 -->
        <p class="login-link">처음이신가요? <a href="profile.html">프로필 만들기</a></p>
      </section>
    </main>

    <!-- CDN에서 Supabase 로드 후 공유 클라이언트, 그 다음 로그인 로직 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase.js"></script>
    <script>
      // 폼과 메시지 영역 가져오기
      var form = document.getElementById("login-form");
      var message = document.getElementById("form-message");

      // 초록색(성공) 또는 빨간색(오류)으로 메시지 표시
      function showMessage(text, type) {
        message.textContent = text;
        message.className = "form-message " + type;
      }

      // 학생이 "로그인"을 눌렀을 때
      form.addEventListener("submit", function (e) {
        e.preventDefault();

        // 학생이 입력한 값 읽기
        var email = document.getElementById("email").value.trim();
        var password = document.getElementById("password").value;

        // 이메일 + 비밀번호로 로그인
        sq.auth
          .signInWithPassword({ email: email, password: password })
          .then(function (result) {
            var error = result.error;

            if (error) {
              // 디버깅을 위해 전체 오류 기록
              console.log("로그인 오류:", error);

              // 일반적인 오류: 잘못된 이메일 또는 비밀번호
              if (error.message.indexOf("Invalid login") !== -1) {
                showMessage("이메일 또는 비밀번호가 잘못되었습니다. 다시 시도해 주세요.", "error");
              } else {
                showMessage("로그인할 수 없습니다. " + error.message, "error");
              }
              return;
            }

            // 성공! 대시보드로 이동
            showMessage("로그인되었습니다! 대시보드로 이동 중...", "success");
            window.location.href = "dashboard.html";
          })
          .catch(function (err) {
            console.log("로그인 오류:", err);
            showMessage("로그인할 수 없습니다. " + err.message, "error");
          });
      });
    </script>
    <!-- Update navbar based on login state -->
    <script src="../auth.js"></script>
  </body>
</html>
