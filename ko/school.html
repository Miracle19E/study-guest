<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Quest — 학교 선택</title>
    <link rel="stylesheet" href="../style.css" />

  <body class="ko">
    <!-- 네비게이션 바 -->

      <p class="version-note">버전 1은 대학생을 위한 것입니다.</p>

      <div class="school-grid">
        <a class="school-card our-school" href="subject.html">
          <span class="school-badge">우리 학교</span>
          <span class="emoji">🏫</span>
          <span class="school-name">군산대학교</span>

        <a class="school-card" href="subject.html">
          <span class="emoji">🏫</span>

          <span class="emoji">🏫</span>

        <a class="school-card" href="subject.html">
          <span class="emoji">🏫</span>
          <span class="school-name">KAIST</span>
          <span class="school-city">대전</span>
        </a>
        <a class="school-card" href="subject.html">
          <span class="emoji">🏫</span>
          <span class="school-name">POSTECH</span>
          <span class="school-city">포항</span>
        </a>
      </div>
    </main>
    <!-- Update navbar based on login state -->
