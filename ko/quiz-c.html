<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Quest — C 프로그래밍 퀴즈</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body class="ko">
    <!-- 네비게이션 바 -->
    <nav class="navbar">
      <a class="brand" href="index.html">Study Quest</a>
      <div class="nav-links">
        <a href="index.html">홈</a>
        <a href="dashboard.html">대시보드</a>
        <a href="about.html">소개</a>
      </div>
      <!-- 언어 전환 -->
      <div class="lang-switch">
        <a href="../quiz-c.html">EN</a>
        <span class="lang-sep">|</span>
        <a href="quiz-c.html" class="active">한국어</a>
      </div>
    </nav>

    <main class="container">
      <!-- 퀴즈 헤더: 타이머 + 점수 -->
      <div class="quiz-header">
        <span class="timer">⏱ 00:30</span>
        <span class="score-box" id="score-box">점수: 0</span>
      </div>

      <h1 class="page-title">C 프로그래밍 퀴즈</h1>
      <p class="subtitle">3문제 • 문제당 30초</p>

      <!-- 진행 바 -->
      <p class="progress-label" id="progress-label">문제 1 / 3</p>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>

      <!-- 문제 카드 (JavaScript로 채워짐) -->
      <div class="card">
        <p class="question-text" id="question-text">로딩 중...</p>
        <div class="answer-options" id="answer-options"></div>
        <p class="explanation" id="explanation"></p>
      </div>

      <!-- 다음 버튼 (답변 후 표시됨) -->
      <div class="actions-row">
        <button class="btn btn-primary next-btn" id="next-btn">다음</button>
      </div>
    </main>

    <!-- 퀴즈 데이터 JSON (script.js가 읽음) -->
    <script type="application/json" id="quiz-data">
    {
      "subject": "C 프로그래밍",
      "resultsUrl": "results.html",
      "labels": { "question": "문제", "of": "/", "next": "다음", "viewResults": "결과 보기", "score": "점수" },
      "questions": [
        {
          "question": "Q1. C에서 출력을 하는 함수는?",
          "options": ["A. print()", "B. printf()", "C. echo()", "D. display()"],
          "correct": 1,
          "topic": "입출력",
          "explanation": "printf()는 화면에 형식화된 출력을 하는 C의 표준 함수입니다."
        },
        {
          "question": "Q2. 표준 C에서 int의 크기는 몇 바이트인가요?",
          "options": ["A. 2", "B. 4", "C. 8", "D. 시스템에 따라 다름"],
          "correct": 3,
          "topic": "데이터 타입",
          "explanation": "C에서 int의 크기는 고정되어 있지 않으며, 시스템과 컴파일러에 따라 다릅니다."
        },
        {
          "question": "Q3. C에서 한 줄 주석을 시작하는 기호는?",
          "options": ["A. #", "B. //", "C. --", "D. <!--"],
          "correct": 1,
          "topic": "기본 문법",
          "explanation": "// 기호는 C(C99 이후)에서 한 줄 주석을 시작합니다."
        }
      ]
    }
    </script>
    <script src="script.js"></script>
  </body>
</html>
