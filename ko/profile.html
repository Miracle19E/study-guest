<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Quest — 프로필 만들기</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body class="ko">
    <!-- 네비게이션 바 -->
    <nav class="navbar">
      <a class="brand" href="index.html">Study Quest</a>
      <div class="nav-links">
        <a href="index.html">홈</a>
        <a href="dashboard.html">대시보드</a>
        <a href="about.html">소개</a>
      </div>
      <!-- 언어 전환 -->
      <div class="lang-switch">
        <a href="../profile.html">EN</a>
        <span class="lang-sep">|</span>
        <a href="profile.html" class="active">한국어</a>
      </div>
    </nav>

    <main class="container">
      <!-- 프로필 만들기 카드 -->
      <section class="card profile-card">
        <h2 class="profile-heading">프로필 만들기</h2>
        <p class="subtitle profile-sub">퀘스트에 참여하고 리더보드를 올려보세요.</p>

        <!-- 프로필 폼: 계정을 만들면 데이터베이스가 프로필 행을 만듭니다 -->
        <form class="profile-form" id="profile-form" novalidate>
          <!-- 이름 -->
          <div class="form-field">
            <label for="name">이름</label>
            <input type="text" id="name" name="name" placeholder="전체 이름" required />
          </div>

          <!-- 닉네임 (리더보드에 실명 대신 표시됨) -->
          <div class="form-field">
            <label for="nickname">닉네임</label>
            <input type="text" id="nickname" name="nickname" placeholder="리더보드 이름" required />
            <span class="form-hint">리더보드에 실명 대신 표시됩니다.</span>
          </div>

          <!-- 나이 -->
          <div class="form-field">
            <label for="age">나이</label>
            <input type="number" id="age" name="age" placeholder="20" min="1" max="120" />
          </div>

          <!-- 학력 드롭다운 -->
          <div class="form-field">
            <label for="education">학력</label>
            <select id="education" name="education">
              <option value="" disabled selected>학력을 선택하세요</option>
              <option value="undergraduate">대학교</option>
              <option value="master">석사</option>
              <option value="phd">박사</option>
            </select>
          </div>

          <!-- 이메일 -->
          <div class="form-field">
            <label for="email">이메일</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required />
          </div>

          <!-- 비밀번호 -->
          <div class="form-field">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required />
          </div>

          <!-- 제출 버튼 -->
          <button type="submit" class="btn btn-primary profile-submit">프로필 만들기</button>
        </form>

        <!-- 성공 / 오류 메시지 영역 (JavaScript로 채워짐) -->
        <p class="form-message" id="form-message"></p>

        <!-- 계정이 이미 있는 학생을 위한 링크 -->
        <p class="login-link">이미 계정이 있으신가요? <a href="login.html">로그인</a></p>
      </section>
    </main>

    <!-- CDN에서 Supabase 로드 후 공유 클라이언트, 그 다음 프로필 로직 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase.js"></script>
    <script>
      // 페이지에서 폼과 메시지 영역 가져오기
      var form = document.getElementById("profile-form");
      var message = document.getElementById("form-message");

      // 초록색(성공) 또는 빨간색(오류)으로 메시지 표시
      function showMessage(text, type) {
        message.textContent = text;
        message.className = "form-message " + type;
      }

      // 학생이 "프로필 만들기"를 눌렀을 때
      form.addEventListener("submit", function (e) {
        // 페이지가 새로고침되지 않도록 막기
        e.preventDefault();

        // 학생이 입력한 값 읽기
        var email = document.getElementById("email").value.trim();
        var password = document.getElementById("password").value;
        var name = document.getElementById("name").value.trim();
        var nickname = document.getElementById("nickname").value.trim();
        var age = document.getElementById("age").value;
        var education = document.getElementById("education").value;

        // Supabase Auth로 회원가입합니다. 프로필 세부 정보는 options.data에
        // 들어가며, 데이터베이스 트리거가 이를 사용해 자동으로 profiles 행을
        // 만듭니다. 여기서 profiles 테이블에 직접 삽입하지 않습니다.
        sq.auth
          .signUp({
            email: email,
            password: password,
            options: {
              data: {
                name: name,
                nickname: nickname,
                age: age,
                education: education,
              },
            },
          })
          .then(function (result) {
            var error = result.error;

            if (error) {
              // 디버깅을 위해 전체 오류 기록
              console.log("회원가입 오류:", error);

              // 친절한 메시지 아래에 실제 오류 텍스트 표시
              showMessage(
                "프로필을 만들 수 없습니다. " + error.message,
                "error"
              );
              return;
            }

            // 성공! 학생에게 알리고 학교 선택 페이지로 이동
            showMessage("프로필이 생성되었습니다! 학교 선택 페이지로 이동 중...", "success");
            window.location.href = "school.html";
          })
          .catch(function (err) {
            // 네트워크 또는 예기치 않은 오류
            console.log("회원가입 오류:", err);
            showMessage("프로필을 만들 수 없습니다. " + err.message, "error");
          });
      });
    </script>
    <!-- Update navbar based on login state -->
    <script src="../auth.js"></script>
  </body>
</html>
