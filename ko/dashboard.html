<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Quest — 대시보드</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body class="ko">
    <!-- 네비게이션 바 -->
    <nav class="navbar">
      <a class="brand" href="index.html">Study Quest</a>
      <div class="nav-links">
        <a href="index.html">홈</a>
        <a href="dashboard.html" class="active">대시보드</a>
        <a href="about.html">소개</a>
      </div>
      <!-- 언어 전환 -->
      <div class="lang-switch">
        <a href="../dashboard.html">EN</a>
        <span class="lang-sep">|</span>
        <a href="dashboard.html" class="active">한국어</a>
      </div>
    </nav>

    <main class="container">
      <h1 class="page-title">대시보드</h1>
      <p class="subtitle">학습 진행 상황을 한눈에 확인하세요.</p>

      <!-- 통계 카드: XP, 레벨, 연속 학습일 -->
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-value">1,250</div>
          <div class="stat-label">XP 포인트</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">레벨 5</div>
          <div class="stat-label">현재 레벨</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">5일</div>
          <div class="stat-label">연속 학습일</div>
        </div>
      </div>

      <!-- 익명 리더보드 -->
      <div class="card">
        <h2 style="font-size:1.2rem; margin:0 0 16px;">상위 학생</h2>
        <table class="leaderboard">
          <thead>
            <tr>
              <th>순위</th>
              <th>이름</th>
              <th>XP</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="rank-1">1</td>
              <td>Student_01</td>
              <td>3,800</td>
            </tr>
            <tr>
              <td>2</td>
              <td>Student_02</td>
              <td>3,200</td>
            </tr>
            <tr>
              <td>3</td>
              <td>Student_03</td>
              <td>2,950</td>
            </tr>
            <tr>
              <td>4</td>
              <td>Student_04</td>
              <td>2,100</td>
            </tr>
            <tr>
              <td>5</td>
              <td>나</td>
              <td>1,250</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- 새 퀴즈 시작 버튼 -->
      <div class="actions-row">
        <a class="btn btn-primary" href="school.html">새 퀴즈 시작</a>
      </div>
    </main>
  </body>
</html>
