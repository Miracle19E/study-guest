<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Quest — 대시보드</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body class="ko">
    <!-- 네비게이션 바 -->
    <nav class="navbar">
      <a class="brand" href="index.html">Study Quest</a>
      <div class="nav-links">
        <a href="index.html">홈</a>
        <a href="dashboard.html" class="active">대시보드</a>
        <a href="about.html">소개</a>
      </div>
      <!-- 언어 전환 -->
      <div class="lang-switch">
        <a href="../dashboard.html">EN</a>
        <span class="lang-sep">|</span>
        <a href="dashboard.html" class="active">한국어</a>
      </div>
    </nav>

    <main class="container">
      <h1 class="page-title">대시보드</h1>
      <p class="subtitle" id="dashboard-subtitle">진행 상황을 불러오는 중...</p>

      <!-- 통계 카드: XP, 레벨, 닉네임 -->
      <div class="stat-grid" id="stat-grid">
        <div class="stat-card">
          <div class="stat-value" id="stat-xp">—</div>
          <div class="stat-label">XP 포인트</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-level">—</div>
          <div class="stat-label">현재 레벨</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-nickname">—</div>
          <div class="stat-label">닉네임</div>
        </div>
      </div>

      <!-- 최근 퀴즈 결과 (JavaScript로 채워짐) -->
      <div class="card">
        <h2 style="font-size:1.2rem; margin:0 0 16px;">최근 퀴즈</h2>
        <p class="loading-text" id="loading-text">불러오는 중...</p>
        <table class="leaderboard" id="results-table" style="display:none;">
          <thead>
            <tr>
              <th>과목</th>
              <th>점수</th>
              <th>XP</th>
              <th>날짜</th>
            </tr>
          </thead>
          <tbody id="results-body"></tbody>
        </table>
        <p class="empty-message" id="empty-message" style="display:none;">
          아직 퀴즈가 없습니다. 첫 퀴즈를 풀면 결과가 여기에 표시됩니다!
        </p>
      </div>

      <!-- 새 퀴즈 시작 버튼 -->
      <div class="actions-row">
        <a class="btn btn-primary" href="school.html">새 퀴즈 시작</a>
      </div>
    </main>

    <!-- Supabase 로드 후 공유 클라이언트, 그 다음 대시보드 로직 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase.js"></script>
    <script>
      // 학생의 통계와 최근 5개 퀴즈 결과 불러오기
      (function () {
        // 학생이 로그인했는지 확인
        sq.auth.getSession().then(function (result) {
          var session = result.data && result.data.session;

          if (!session) {
            // 로그인하지 않은 경우 — 메시지와 로그인 링크 표시
            document.getElementById("dashboard-subtitle").innerHTML =
              '대시보드를 보려면 <a href="login.html">로그인</a>해 주세요.';
            document.getElementById("loading-text").style.display = "none";
            return;
          }

          var userId = session.user.id;

          // 학생의 프로필 (닉네임, xp) 불러오기
          sq.from("profiles")
            .select("nickname, xp")
            .eq("id", userId)
            .maybeSingle()
            .then(function (profileRes) {
              var profile = profileRes.data;

              if (!profile) {
                document.getElementById("dashboard-subtitle").textContent =
                  "프로필을 불러올 수 없습니다.";
                document.getElementById("loading-text").style.display = "none";
                return;
              }

              // 레벨 계산: 1 + floor(xp / 50)
              var level = 1 + Math.floor((profile.xp || 0) / 50);

              // 통계 카드 채우기
              document.getElementById("stat-xp").textContent = profile.xp || 0;
              document.getElementById("stat-level").textContent = "레벨 " + level;
              document.getElementById("stat-nickname").textContent = profile.nickname;
              document.getElementById("dashboard-subtitle").textContent =
                "학습 진행 상황을 한눈에 확인하세요.";

              // 최근 5개 퀴즈 결과 불러오기
              sq.from("quiz_results")
                .select("subject, score, total, xp_earned, created_at")
                .eq("user_id", userId)
                .order("created_at", { ascending: false })
                .limit(5)
                .then(function (resultsRes) {
                  var results = resultsRes.data;

                  document.getElementById("loading-text").style.display = "none";

                  if (results && results.length > 0) {
                    // 결과 테이블 표시
                    var tbody = document.getElementById("results-body");
                    tbody.innerHTML = "";
                    results.forEach(function (r) {
                      var tr = document.createElement("tr");
                      // 날짜를 짧고 읽기 쉬운 형식으로 변환
                      var date = new Date(r.created_at).toLocaleDateString();
                      // 안전하게 셀을 textContent로 만들기
                      var cells = [r.subject, r.score + " / " + r.total, r.xp_earned, date];
                      cells.forEach(function (value) {
                        var td = document.createElement("td");
                        td.textContent = value;
                        tr.appendChild(td);
                      });
                      tbody.appendChild(tr);
                    });
                    document.getElementById("results-table").style.display = "table";
                  } else {
                    // 결과가 없는 경우 — 친절한 메시지 표시
                    document.getElementById("empty-message").style.display = "block";
                  }
                });
            });
        });
      })();
    </script>
    <!-- Update navbar based on login state -->
    <script src="../auth.js"></script>
  </body>
</html>
